<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宋立｜三角龍・本機試看</title><style>body{margin:0;background:#eee;font:16px sans-serif}canvas{display:block}nav{position:fixed;top:12px;left:12px;display:flex;gap:8px}button{min-height:44px;padding:8px}#status{position:fixed;bottom:12px;left:12px;background:#fff;padding:8px}</style><script type="importmap">{"imports":{"three":"../展場/lib/three.module.js"}}</script><nav><button id="home">回正面</button><button id="normal">有／無貼圖</button><button id="spin">自動旋轉</button><a href="../展場/index.html?intro=0" style="padding:12px;background:white;color:#333">← 返回宋立區</a></nav><div id="status">正在載入三角龍…</div><script type="module">import * as T from 'three';import{OrbitControls}from'../展場/lib/addons/OrbitControls.js';import{GLTFLoader}from'../作品2_藍鳥/viewer/GLTFLoader.js';const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.75));r.setSize(innerWidth,innerHeight);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color(0xeeeeee);s.add(new T.HemisphereLight(0xffffff,0x999999,1));for(const p of [[-3,4,-5],[4,2,3]]){const l=new T.DirectionalLight(0xffffff,1.7);l.position.set(...p);s.add(l)}const c=new T.PerspectiveCamera(42,innerWidth/innerHeight,.001,100);const o=new OrbitControls(c,r.domElement);o.minPolarAngle=Math.PI/9;o.maxPolarAngle=Math.PI/2-.08;o.enablePan=false;let size=1,m;const originals=new Map();new GLTFLoader().load('./三角龍_web.glb',g=>{m=g.scene;s.add(m);const b=new T.Box3().setFromObject(m),ctr=b.getCenter(new T.Vector3());size=b.getSize(new T.Vector3()).length();m.position.sub(ctr);m.traverse(x=>{if(x.isMesh)originals.set(x,x.material)});home();document.querySelector('#status').textContent='宋立｜三角龍・拖曳旋轉、滾輪縮放；不開放底部視角。'},undefined,e=>{document.querySelector('#status').textContent='三角龍載入失敗，請重新整理。'});function home(){o.autoRotate=false;o.target.set(0,0,0);c.position.set(size*.45,size*.2,-size*1.6/Math.min(1,c.aspect));c.near=Math.max(size/1000,.00001);c.far=size*100;c.updateProjectionMatrix();o.update()}let normal=false;document.querySelector('#home').onclick=home;document.querySelector('#normal').onclick=()=>{normal=!normal;for(const[x,mat]of originals)x.material=normal?new T.MeshNormalMaterial():mat};document.querySelector('#spin').onclick=()=>o.autoRotate=!o.autoRotate;addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});r.setAnimationLoop(()=>{o.update();r.render(s,c)});</script></html>
