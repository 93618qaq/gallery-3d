<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '../作品2_藍鳥/viewer/GLTFLoader.js';
import {MeshoptDecoder} from '../作品2_藍鳥/viewer/meshopt_decoder.module.js';
import {OrbitControls} from 'three/addons/OrbitControls.js';
const status=document.querySelector('#status'),buttons=[...document.querySelectorAll('button')],reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(r.domElement);r.domElement.tabIndex=0;r.domElement.setAttribute('aria-label','劍龍立體檢視；拖曳旋轉，滾輪縮放；方向鍵旋轉，加減鍵縮放，Home回正面');
const s=new THREE.Scene();s.background=new THREE.Color(0xeeeae2);const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.001,20);
const c=new OrbitControls(cam,r.domElement);c.enableDamping=!reduced;c.dampingFactor=.08;c.minDistance=.29;c.maxDistance=1.5;c.rotateSpeed=.8;c.zoomSpeed=.8;c.enablePan=false;c.minPolarAngle=Math.PI/9;c.maxPolarAngle=Math.PI/2-.08;c.screenSpacePanning=false;c.autoRotateSpeed=1;
s.add(new THREE.HemisphereLight(0xffffff,0x77716a,1.8));const key=new THREE.DirectionalLight(0xfff5e8,2.2);key.position.set(1,2,3);s.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.4);fill.position.set(-2,1,-2);s.add(fill);
let home=.7,loaded=false,obj;const spin=document.querySelector('#spin');
function stop(){c.autoRotate=false;spin.textContent='自動旋轉：關';spin.setAttribute('aria-pressed','false')}
function view(back=false){stop();const damping=c.enableDamping;c.enableDamping=false;c.update();c.enableDamping=damping;c.target.set(0,0,0);cam.position.set(0,.14,back?-home:home);c.update()}
function zoom(f){stop();const offset=cam.position.clone().sub(c.target);offset.setLength(THREE.MathUtils.clamp(offset.length()*f,c.minDistance,c.maxDistance));cam.position.copy(c.target).add(offset);c.update()}
function fail(){loaded=false;window.ready=false;buttons.forEach(b=>b.disabled=true);status.hidden=false;status.textContent='作品載入失敗，請重新整理，或按右上角返回展場。'}
const mgr=new THREE.LoadingManager();mgr.onError=fail;mgr.onLoad=()=>{if(!obj||status.textContent.includes('失敗'))return;loaded=true;window.ready=true;status.hidden=true;buttons.forEach(b=>b.disabled=false);view()};
// ACCEPTED_DRAGON_SHAFT_20261117
// Shaft-only room reflection: broad pale wall, darker ceramic/floor and overhead light.
const sw=256,sh=128,sd=new Float32Array(sw*sh*4);
for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const a=x/sw*2*Math.PI,t=y/sh*Math.PI,i=(y*sw+x)*4;let d=Math.abs(a-1.25);d=Math.min(d,2*Math.PI-d);let e=Math.abs(a-4.6);e=Math.min(e,2*Math.PI-e);const wall=.57*Math.exp(-d*d/.65)+.19*Math.exp(-e*e/1.1),ceiling=.55*Math.pow(Math.max(0,Math.cos(t)),5),level=.055+wall*Math.pow(Math.sin(t),.65)+ceiling;sd[i]=level*1.02;sd[i+1]=level;sd[i+2]=level*.95;sd[i+3]=1;}
const se=new THREE.DataTexture(sd,sw,sh,THREE.RGBAFormat,THREE.FloatType);se.mapping=THREE.EquirectangularReflectionMapping;se.needsUpdate=true;const sp=new THREE.PMREMGenerator(r),softShaftEnvironment=sp.fromEquirectangular(se).texture;se.dispose();sp.dispose();

new GLTFLoader(mgr).setMeshoptDecoder(MeshoptDecoder).load('sculpture3_detail_20261117.glb?v=rod-metal-20261117',gltf=>{
 obj=gltf.scene;obj.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(obj,true),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 const holder=new THREE.Group();holder.add(obj);obj.position.sub(center);// 原始驗收模型保持原尺寸與比例，不變形。
 obj.traverse(m=>{if(m.isMesh){for(const mat of [m.material].flat()){applyAcceptedDragonShaft(mat);if(mat.map)mat.map.anisotropy=Math.min(8,r.capabilities.getMaxAnisotropy())}}});s.add(holder);window.__sculpture.object=holder;
},undefined,fail);
document.querySelector('#front').onclick=()=>view();document.querySelector('#rear').onclick=()=>view(true);document.querySelector('#closer').onclick=()=>zoom(.8);document.querySelector('#farther').onclick=()=>zoom(1.25);
spin.onclick=()=>{c.autoRotate=!c.autoRotate;spin.setAttribute('aria-pressed',String(c.autoRotate));spin.textContent=`自動旋轉：${c.autoRotate?'開':'關'}`};c.addEventListener('start',stop);
r.domElement.addEventListener('keydown',e=>{if(!loaded||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','Home'].includes(e.key))return;e.preventDefault();stop();if(e.key==='Home'){view();return}if(['+','=','-'].includes(e.key)){zoom(e.key==='-'?1.25:.8);return}const sp=new THREE.Spherical().setFromVector3(cam.position.clone().sub(c.target));if(e.key==='ArrowLeft')sp.theta-=.15;if(e.key==='ArrowRight')sp.theta+=.15;if(e.key==='ArrowUp')sp.phi-=.15;if(e.key==='ArrowDown')sp.phi+=.15;sp.phi=THREE.MathUtils.clamp(sp.phi,c.minPolarAngle,c.maxPolarAngle);sp.makeSafe();cam.position.copy(c.target).add(new THREE.Vector3().setFromSpherical(sp));c.update()});
document.querySelector('#back').onclick=e=>{if(new URLSearchParams(location.search).get('from')==='gallery'){e.preventDefault();window.close();setTimeout(()=>location.assign('../展場/index.html?intro=0'),150)}};
function resize(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();home=Math.max(.62,.15/(Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.aspect));if(loaded)view()}addEventListener('resize',resize);resize();window.__sculpture={camera:cam,controls:c,renderer:r,scene:s,THREE};r.setAnimationLoop(()=>{if(!document.hidden){c.update();r.render(s,cam)}});
</script></html>
