<header><h1>宋立｜小釋迦</h1><p>松風閣畫廊・細看作品</p><p>拖曳轉動，滾輪或雙指縮放・不開放底部視角</p><p id="notice">實量：總高 19 公分、石柱高 11.5 公分、方底 8 × 8 公分。尺寸已校準；未拍到的底面依外緣推估補形。</p></header>
<div class="panel"><div id="status" role="status">正在載入雕件…</div><button id="reset">回到正面</button><button id="clay" aria-pressed="false">看無貼圖外形</button><button id="auto" aria-pressed="false">自動旋轉</button><button id="rear">看背面</button><button id="closer">＋ 放大</button><button id="farther">－ 縮小</button><a id="back" href="../展場/index.html?intro=0">← 返回展場</a></div>

import * as THREE from 'three';import {OrbitControls} from '../展場/lib/addons/OrbitControls.js';import {GLTFLoader} from '../作品2_藍鳥/viewer/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#f4f2ee');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.001,20),controls=new OrbitControls(camera,renderer.domElement),center=new THREE.Vector3(0,.095,0);controls.enableDamping=false;controls.minDistance=.16;controls.enablePan=false;controls.minPolarAngle=Math.PI/9;controls.maxPolarAngle=Math.PI/2-.08;controls.maxDistance=1.4;
scene.add(new THREE.HemisphereLight(0xffffff,0xb8b8b8,2));const key=new THREE.DirectionalLight(0xffffff,2.3);key.position.set(-.5,.8,.7);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,.8);fill.position.set(.6,.4,-.6);scene.add(fill);
// PHOTO_GLAZE_ENV: neutral softbox reflections for dielectric ceramic glaze.
const envW=512,envH=256,envData=new Float32Array(envW*envH*4);
for(let y=0;y<envH;y++)for(let x=0;x<envW;x++){let v=.13;if((x>55&&x<100&&y>55&&y<130)||(x>300&&x<330&&y>75&&y<150))v=2.8;if(y>190)v=.065;const k=(y*envW+x)*4;envData[k]=envData[k+1]=envData[k+2]=v;envData[k+3]=1;}
const envInput=new THREE.DataTexture(envData,envW,envH,THREE.RGBAFormat,THREE.FloatType);envInput.mapping=THREE.EquirectangularReflectionMapping;envInput.needsUpdate=true;const envMaker=new THREE.PMREMGenerator(renderer);const envTarget=envMaker.fromEquirectangular(envInput);scene.environment=envTarget.texture;envInput.dispose();envMaker.dispose();
const clayMat=new THREE.MeshStandardMaterial({color:0xb8b3a8,roughness:.85,side:THREE.DoubleSide});let model,clay=false;const errors=[];window.addEventListener('error',e=>errors.push(e.message));
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(model)home();}addEventListener('resize',resize);resize();function home(){controls.autoRotate=false;document.querySelector('#auto').setAttribute('aria-pressed','false');document.querySelector('#auto').textContent='自動旋轉';controls.target.copy(center);camera.position.set(.10,.19,Math.max(.43,.16/(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect)));controls.update();}home();
function setClay(on){if(!model)return;model.traverse(o=>{if(o.isMesh)o.material=on?clayMat:o.userData.originalMaterial});renderer.render(scene,camera);}
document.querySelector('#reset').onclick=home;
function zoom(f){const v=camera.position.clone().sub(controls.target);v.setLength(THREE.MathUtils.clamp(v.length()*f,controls.minDistance,controls.maxDistance));camera.position.copy(controls.target).add(v);controls.update();}
document.querySelector('#rear').onclick=()=>{home();camera.position.z=-camera.position.z;controls.update();};document.querySelector('#closer').onclick=()=>zoom(.8);document.querySelector('#farther').onclick=()=>zoom(1.25);
document.querySelector('#back').onclick=e=>{if(new URLSearchParams(location.search).get('from')==='gallery'){e.preventDefault();window.close();setTimeout(()=>location.assign('../展場/index.html?intro=0'),150);}};
renderer.domElement.tabIndex=0;renderer.domElement.setAttribute('aria-label','小釋迦立體檢視：拖曳旋轉、滾輪縮放、方向鍵旋轉、加減縮放、Home回正面');renderer.domElement.addEventListener('keydown',e=>{if(!model)return;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','Home'].includes(e.key))return;e.preventDefault();if(e.key==='Home')return home();if(['+','=','-'].includes(e.key))return zoom(e.key==='-'?1.25:.8);controls.autoRotate=false;const v=new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));if(e.key==='ArrowLeft')v.theta-=.15;if(e.key==='ArrowRight')v.theta+=.15;if(e.key==='ArrowUp')v.phi-=.15;if(e.key==='ArrowDown')v.phi+=.15;v.phi=THREE.MathUtils.clamp(v.phi,controls.minPolarAngle,controls.maxPolarAngle);v.makeSafe();camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(v));controls.update();});document.querySelector('#clay').onclick=e=>{clay=!clay;setClay(clay);e.target.setAttribute('aria-pressed',clay);e.target.textContent=clay?'看原本貼圖':'看無貼圖外形';};document.querySelector('#auto').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.setAttribute('aria-pressed',controls.autoRotate);e.target.textContent=controls.autoRotate?'停止旋轉':'自動旋轉';};
document.querySelectorAll('button').forEach(b=>b.disabled=true);const status=document.querySelector('#status'),manager=new THREE.LoadingManager();manager.onError=url=>errors.push(url);
try{const gltf=await new GLTFLoader(manager).loadAsync('小釋迦.glb?finish=fe6e82188085');model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.material.envMapIntensity=.42;o.userData.originalMaterial=o.material;if(o.material.map)o.material.map.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());}});scene.add(model);home();document.querySelectorAll('button').forEach(b=>b.disabled=false);status.textContent='載入完成，可以轉動查看';window.__review={THREE,scene,renderer,camera,controls,model,errors,loaded:true,center,setClay,setView:(v)=>{controls.autoRotate=false;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(...v));controls.update();renderer.render(scene,camera);}};
}catch(e){errors.push(String(e));status.textContent='載入失敗：'+e.message;window.__review={loaded:false,errors};}
