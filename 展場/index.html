<style>

<script type="module">
import * as THREE from 'three';
import {OBJLoader} from 'three/addons/OBJLoader.js';

const Q = new URLSearchParams(location.search);

// 視角手感（2026-11-16 番薯：滑鼠移動視角不夠絲滑）。每一項都能用網址關掉、回舊行為對照：

const LOOK_LAMBDA = +Q.get('look') > 0 ? +Q.get('look') : 14;   // 視角追目標的快慢（THREE.MathUtils.damp 的 lambda；與幀率無關；14＝約 0.21 秒追到 95%）。網址 ?look=數字 可調：越大越跟手、越小越滑（look=0 關閉緩衝）

const CFG = {W: 9.0, D: 7.3, H: 3.0, hangY: 1.45, floatOut: .9, eye: 1.6};
const {W, D, H} = CFG;

// ---------- 小工具 ----------

  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d'), r = rng(7), rows = 8, ph = 1024 / rows;

      for (let k = 0; k < 9; k++) { const y = i * ph + r() * ph; g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (r() - .5) * 5); g.stroke(); }

const PALS = [['#efe6d6', '#c8452f', '#2d3a4a', '#d9a441'], ['#1f2a36', '#e8d9b5', '#c8452f', '#7fa1a0'], ['#e9e2d0', '#3b6a73', '#d98f5a', '#8a2f3a'], ['#d8dfd4', '#4c6b4a', '#e4c56d', '#2a2a2a'],
  ['#f2e4e0', '#c46a74', '#5a4b7a', '#e8c27a'], ['#c9d6e2', '#1e3550', '#e9b44c', '#a23b3b'], ['#2b2420', '#e6d3a3', '#b5543b', '#6f8f7a'], ['#efece6', '#222222', '#c8452f', '#7a8a8c']];
function artTexture(seed) {   // 示意畫作：程式畫的抽象色塊，不是真作品
  const r = rng(seed * 97 + 5), c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), pal = PALS[seed % PALS.length];
  g.fillStyle = pal[0]; g.fillRect(0, 0, 256, 256);
  const n = 4 + Math.floor(r() * 4);
  for (let i = 0; i < n; i++) {
    g.fillStyle = g.strokeStyle = pal[1 + Math.floor(r() * (pal.length - 1))]; const x = r() * 256, y = r() * 256, s = 30 + r() * 120, k = Math.floor(r() * 4);

    else if (k === 2) { g.lineWidth = 6 + r() * 14; g.beginPath(); g.arc(x, y, s / 2, r() * 6, r() * 6 + 2.4); g.stroke(); }

}

// 效能（2026-11-09）：每盞真燈都要算進每個受光材質；牆、展板、天花板、展台粗糙度 .7～1，幾乎沒有鏡面反光，
// 用 Lambert（只算漫反射）和 Standard（再多算一層 GGX 鏡面）畫面幾乎一樣、但每盞燈的成本低很多。地板、畫框、作品仍用 Standard。網址 lam=0 回原材質對照。

const floorMat = new THREE.MeshStandardMaterial({map: woodTexture([W / 2.4, D / 2.4]), roughness: V === 3 ? .26 : .42});

const pickBlockers = [];
function wallPlane(w, h, x, y, z, ry) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallBase); m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); pickBlockers.push(m); }

if (V >= 2) {

}

const stripMats = [];

const PANEL = {len: 2.4, h: 2.4, t: .05};
// 2026-11-09 番薯「挨開它」：原本第 3 片展板在正中間（0, 1.3）橫著擋住後牆中央的兩件真作品；改成轉 90 度（和後牆垂直）並移到右邊（x=1.7），
// 從入口看過去視線不再被擋。網址 panel3=old 回到原本位置對照。
